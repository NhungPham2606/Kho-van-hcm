<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Xác nhận số liệu</title>
<style>
  :root { --bg: #f0f2f5; --card: #fff; --ink: #111827; --muted: #6b7280; --ok: #0e9f6e; --err: #e02424; --line: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --card: #1f2937; --ink: #f3f4f6; --muted: #9ca3af; --line: #374151; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", Arial, sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; text-align: center; }
  .logo { height: 46px; margin-bottom: 6px; }
  .brand { font-weight: 700; color: #1a56db; margin-bottom: 18px; }
  .icon { font-size: 52px; line-height: 1; margin: 6px 0 10px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 6px 0; color: var(--muted); }
  .info { margin: 14px 0 4px; padding: 10px 12px; border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 14px; }
  .spin { width: 40px; height: 40px; margin: 8px auto 14px; border: 4px solid var(--line); border-top-color: #1a56db; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 8px; background: var(--err); color: #fff; text-decoration: none; font-weight: 600; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="../assets/logo.png?v=2" alt="CPC1HN">
  <div class="brand">Kho Vận CN.HCM</div>
  <div id="view"><div class="spin"></div><h1>Đang ghi nhận xác nhận…</h1></div>
</div>
<script>
// Nút "Xác nhận số liệu đúng" trong mail hằng ngày trỏ về trang này: ?ma=<Mã NV>&ngay=<dd/mm/yyyy>
// Trang tự gửi 1 câu trả lời "Đúng" vào Google Form "Xác nhận số liệu giao hàng" rồi báo đã ghi nhận.
(function () {
  var FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdHJWubQUDfL92MAN8PLci2dEZqim0TFtAZL_XvDjUR0bczFw/';
  var E = { ma: '10506754', ten: '235047419', ngay: '1004119876', kq: '1758913475' };
  var q = new URLSearchParams(location.search);
  var ma = (q.get('ma') || '').replace(/\D/g, ''), ngay = (q.get('ngay') || '').trim(), ten = (q.get('ten') || '').trim();
  var view = document.getElementById('view');
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var saiLink = FORM + 'viewform?usp=pp_url&entry.' + E.ma + '=' + encodeURIComponent(ma) + '&entry.' + E.ngay + '=' + encodeURIComponent(ngay)
    + (ten ? '&entry.' + E.ten + '=' + encodeURIComponent(ten) : '') + '&entry.' + E.kq + '=' + encodeURIComponent('Sai');
  if (!ma || !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(ngay)) {
    view.innerHTML = '<div class="icon">⚠️</div><h1 class="err">Đường link không đúng</h1><p>Vui lòng bấm lại nút trong mail báo cáo.</p>';
    return;
  }
  // chống bấm 2 lần trong cùng trình duyệt
  var key = 'kvh-xn-' + ma + '-' + ngay, done = false;
  try { done = localStorage.getItem(key) === '1'; } catch (e) {}
  function ok(again) {
    view.innerHTML = '<div class="icon">✅</div><h1 class="ok">' + (again ? 'Anh/chị đã xác nhận trước đó' : 'Đã ghi nhận xác nhận') + '</h1>'
      + '<div class="info">Mã NV <b>' + esc(ma) + '</b>' + (ten ? ' · ' + esc(ten) : '') + '<br>Số liệu giao hàng đến ngày <b>' + esc(ngay) + '</b>: <b class="ok">ĐÚNG</b></div>'
      + '<p>Cảm ơn anh/chị. Có thể đóng trang này.</p>'
      + '<p style="margin-top:14px;font-size:13px">Bấm nhầm? Báo sai tại đây:</p><a class="btn" href="' + saiLink + '">❌ Báo số liệu sai</a>';
  }
  if (done) { ok(true); return; }
  var body = new URLSearchParams();
  body.append('entry.' + E.ma, ma);
  body.append('entry.' + E.ngay, ngay);
  if (ten) body.append('entry.' + E.ten, ten);
  body.append('entry.' + E.kq, 'Đúng');
  fetch(FORM + 'formResponse', { method: 'POST', mode: 'no-cors', body: body })
    .then(function () { try { localStorage.setItem(key, '1'); } catch (e) {} ok(false); })
    .catch(function () {
      view.innerHTML = '<div class="icon">⚠️</div><h1 class="err">Chưa gửi được</h1><p>Kiểm tra kết nối mạng rồi tải lại trang (F5), hoặc trả lời mail báo cáo với chữ <b>ĐÚNG</b>.</p>';
    });
})();
</script>
</body>
</html>
